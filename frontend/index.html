<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner & Progress Tracker</title>

```
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#6a11cb,#2575fc);
        overflow:hidden;
    }

    .container{
        width:1000px;
        max-width:95%;
        min-height:600px;
        background:rgba(255,255,255,0.12);
        backdrop-filter:blur(15px);
        border-radius:20px;
        display:flex;
        overflow:hidden;
        box-shadow:0 15px 40px rgba(0,0,0,0.3);
    }

    .left-panel{
        flex:1;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        color:white;
        padding:40px;
        text-align:center;
    }

    .left-panel h1{
        font-size:3rem;
        margin-bottom:20px;
    }

    .left-panel p{
        font-size:1.1rem;
        line-height:1.8;
    }

    .right-panel{
        flex:1;
        background:white;
        padding:50px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }

    .tabs{
        display:flex;
        margin-bottom:25px;
    }

    .tab{
        flex:1;
        padding:12px;
        border:none;
        cursor:pointer;
        font-weight:600;
    }

    .active{
        background:#2575fc;
        color:white;
    }

    .form-group{
        margin-bottom:18px;
    }

    .form-group label{
        display:block;
        margin-bottom:6px;
        font-weight:600;
    }

    .form-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
    }

    .btn{
        width:100%;
        padding:14px;
        border:none;
        border-radius:8px;
        background:#2575fc;
        color:white;
        font-size:1rem;
        cursor:pointer;
        margin-top:10px;
    }

    .btn:hover{
        opacity:.9;
    }

    .hidden{
        display:none;
    }

    .footer-text{
        text-align:center;
        margin-top:20px;
        color:#777;
    }
</style>
```

</head>
<body>

<div class="container">

```
<div class="left-panel">
    <h1>Student Planner</h1>
    <p>
        Organize tasks, manage notes, track progress,
        schedule exams, and boost productivity with
        Pomodoro sessions.
    </p>
</div>

<div class="right-panel">

    <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="signupTab" class="tab">Register</button>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <form id="signupForm" class="hidden">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" required>
        </div>

        <button type="submit" class="btn">
            Create Account
        </button>

    </form>

    <div class="footer-text">
        Student Planner & Progress Tracker
    </div>

</div>
```

</div>

<script>

const loginTab=document.getElementById("loginTab");
const signupTab=document.getElementById("signupTab");

const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");

loginTab.onclick=()=>{
    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");
}

signupTab.onclick=()=>{
    signupForm.classList.remove("hidden");
    loginForm.classList.add("hidden");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");
}

loginForm.addEventListener("submit",(e)=>{
    e.preventDefault();

    localStorage.setItem("loggedIn","true");

    window.location.href="dashboard.html";
});

signupForm.addEventListener("submit",(e)=>{
    e.preventDefault();

    alert("Registration Successful!");
});

</script>

</body>
</html>
