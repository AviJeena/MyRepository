<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">EduPlan</div>
            <ul>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="pomodoro.html">Pomodoro</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header>
                <h1>Welcome Back, Scholar!</h1>
                <div class="date-display" id="current-date"></div>
            </header>
            
            <div class="dashboard-grid">
                <div class="card status-card">
                    <h3>Overall Progress</h3>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 68%;">68%</div>
                    </div>
                </div>
                <div class="card">
                    <h3>Today's Focus Tasks</h3>
                    <ul class="task-preview-list">
                        <li><input type="checkbox"> Complete DBMS Assignment</li>
                        <li><input type="checkbox"> Review Operating Systems Lecture 4</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
